<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f19">
  <title>Konnected Alarm Panel Pro</title>
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% -20%, #1e293b 0%, #0f172a 45%, #070a12 100%);
      --card-bg: rgba(30, 41, 59, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-glow: rgba(59, 130, 246, 0.15);
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --glass-blur: blur(24px) saturate(180%);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --safe-area-top: env(safe-area-inset-top, 20px);
      --safe-area-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(90px + var(--safe-area-bottom));
      touch-action: manipulation;
    }

    .banner {
      position: fixed;
      top: -100px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .banner.show { transform: translateY(calc(110px + var(--safe-area-top))); }
    .banner-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(59,130,246,0.2); color: var(--accent-blue); flex-shrink: 0; }
    .banner-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .banner-desc { font-size: 15px; font-weight: 500; color: var(--text-main); }

    .header-bar {
      padding: calc(var(--safe-area-top) + 12px) 20px 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 10, 18, 0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .dynamic-island {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 30px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
    .status-dot.disarmed { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
    .status-dot.armed { background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); animation: pulse 1.5s infinite; }
    .status-dot.stay { background: var(--accent-amber); box-shadow: 0 0 10px var(--accent-amber); }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    .dynamic-title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border);
      display: grid; place-items: center; color: var(--text-main); cursor: pointer; transition: 0.2s;
    }
    .icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }

    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title { font-size: 17px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

    .status-hero { text-align: center; padding: 28px 16px; position: relative; overflow: hidden; }
    .status-shield {
      width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 16px auto; display: grid; place-items: center;
      background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, rgba(16,185,129,0.02) 70%);
      border: 2px solid var(--accent-green); color: var(--accent-green); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .status-shield.armed { background: radial-gradient(circle, rgba(239,68,68,0.2) 0%, rgba(239,68,68,0.02) 70%); border-color: var(--accent-red); color: var(--accent-red); }
    .status-shield.stay { background: radial-gradient(circle, rgba(245,158,11,0.2) 0%, rgba(245,158,11,0.02) 70%); border-color: var(--accent-amber); color: var(--accent-amber); }
    
    .status-hero-state { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .status-hero-sub { font-size: 14px; color: var(--text-muted); }

    .mode-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
    .mode-btn {
      background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: var(--radius-md);
      padding: 14px 8px; text-align: center; color: var(--text-muted); cursor: pointer; transition: 0.2s;
    }
    .mode-btn.active { background: rgba(59,130,246,0.15); border-color: var(--accent-blue); color: #fff; font-weight: 600; }

    .zones-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .zone-tile {
      background: rgba(15, 23, 42, 0.5); border: 1px solid var(--card-border); border-radius: var(--radius-md);
      padding: 16px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
    }
    .zone-tile.triggered { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.5); }
    .zone-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .zone-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,0.08); color: var(--text-muted); }
    .zone-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .zone-status { font-size: 12px; color: var(--text-muted); }
    .zone-tile.triggered .zone-status { color: var(--accent-red); font-weight: 600; }

    .relay-list { display: flex; flex-direction: column; gap: 10px; }
    .relay-item {
      display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
      background: rgba(15, 23, 42, 0.4); border: 1px solid var(--card-border); border-radius: var(--radius-md);
    }
    .relay-info { display: flex; align-items: center; gap: 12px; }
    .toggle {
      width: 50px; height: 30px; background: rgba(255,255,255,0.15); border-radius: 15px; position: relative;
      cursor: pointer; transition: 0.3s;
    }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
      background: #fff; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toggle.active { background: var(--accent-green); }
    .toggle.active::after { transform: translateX(20px); }

    .log-list { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; }
    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: rgba(15, 23, 42, 0.3); border-radius: var(--radius-sm); font-size: 13px; }
    .log-time { font-family: monospace; color: var(--text-dim); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(64px + var(--safe-area-bottom)); padding-bottom: var(--safe-area-bottom);
      background: rgba(7, 10, 18, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; align-items: center; z-index: 1000;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); cursor: pointer; flex: 1; }
    .nav-item.active { color: var(--accent-blue); }
    .nav-label { font-size: 11px; font-weight: 500; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
      z-index: 9999; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .keypad-modal { background: #0f172a; border: 1px solid var(--card-border); border-radius: 28px; width: 300px; padding: 24px; text-align: center; }
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .keypad-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: #fff; font-size: 22px; font-weight: 600; cursor: pointer; margin: 0 auto; display: grid; place-items: center; }
    .keypad-dots { display: flex; justify-content: center; gap: 12px; margin: 16px 0; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--text-muted); }
    .dot.filled { background: var(--accent-blue); border-color: var(--accent-blue); }

    .input-field { width: 100%; background: rgba(15,23,42,0.6); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; color: #fff; font-size: 14px; margin-top: 6px; margin-bottom: 14px; }
  </style>
</head>
<body>

    </div>
